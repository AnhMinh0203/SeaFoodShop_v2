<p-toast />
<p-confirmdialog />
<c-card>
  <c-card-header>
    <h5>Thêm sản phẩm</h5>
  </c-card-header>
  <c-card-body class="p-4">
    <div class="row">
      <div class="col-12 col-sm-12 col-md-5 col-lg-5 col-xl-5 ">
        <div class="button-back d-flex align-items-center" style="cursor: pointer;">
          <i class="pi pi-arrow-circle-left" (click)="navigateToProductManagement()" style="font-size: 30px;"></i>
        </div>
      </div>
      <div class="col-12 col-sm-12 col-md-7 col-lg-7 col-xl-7 ">
        <div class="button_features d-flex justify-content-end align-items-center">
          <div class="me-2 mt-2">
            <p-button icon="pi pi-list" label="Quản lý danh mục" severity="success" (click)="showCategoryForm()" />
          </div>
          <div class="me-2 mt-2">
            <p-button icon="pi pi-tag" label="Quản lý voucher" severity="success" (click)="showVoucherForm()" />
          </div>
        </div>
      </div>
    </div>
    <hr>

    <div class="product-infor">
      <div class="row">
        <h6><b>1. Thông tin sản phẩm</b></h6>
        <div class="col-12 col-sm-12 col-md-12 col-lg-12 col-xl-12 ">
          <div class="row">
            <div class="col-12 col-sm-12 col-md-3 col-lg-3 col-xl-3 ">
              <div class="d-flex flex-column">
                <label for="name" class="block mt-3">Tên sản phẩm</label>
                <input pInputText id="name" [(ngModel)]="name" />
              </div>
            </div>
            <div class="col-12 col-sm-12 col-md-3 col-lg-3 col-xl-3 ">
              <div class="d-flex flex-column">
                <label for="price" class="block mt-3">Giá</label>
                <p-inputnumber inputId="integeronly" [(ngModel)]="price" />
              </div>
            </div>
            <div class="col-12 col-sm-12 col-md-3 col-lg-3 col-xl-3 ">
              <div class="d-flex flex-column">
                <label for="origin" class="block mt-3">Xuất xứ</label>
                <input pInputText id="origin" [(ngModel)]="origin" />
              </div>
            </div>

            <div class="col-12 col-sm-12 col-md-3 col-lg-3 col-xl-3 ">
              <div class="d-flex flex-column">
                <label for="quantity" class="block mt-3">Số lượng</label>

                <p-inputnumber inputId="integeronly" [(ngModel)]="quantity" />
              </div>
            </div>
            <div class="col-12 col-sm-12 col-md-3 col-lg-3 col-xl-3 ">
              <div class="d-flex flex-column">
                <label for="instruct" class="block mt-3">Hướng dẫn</label>
                <input pInputText id="instruct" [(ngModel)]="instruct" />
              </div>
            </div>
            <div class="col-12 col-sm-12 col-md-3 col-lg-3 col-xl-3 ">
              <div class="d-flex flex-column">
                <label for="unit" class="block mt-3">Đơn vị</label>
                <!-- <p-select [options]="unit" [(ngModel)]="unitSelect" optionLabel="unit" class="w-full md:w-56" /> -->
                <input pInputText id="unit" [(ngModel)]="unit" />
              </div>
            </div>
            <div class="col-12 col-sm-12 col-md-3 col-lg-3 col-xl-3 ">
              <div class="d-flex flex-column">
                <label for="category" class="block mt-3">Loại</label>
                <p-select [options]="categories" [(ngModel)]="categorySelect" optionLabel="name"
                  class="w-full md:w-56" />
              </div>
            </div>
            <div class="col-12 col-sm-12 col-md-3 col-lg-3 col-xl-3 ">
              <div class="d-flex flex-column">
                <label for="voucher" class="block mt-3">Mã giảm giá</label>
                <p-select [options]="vouchers" [(ngModel)]="voucherSelect" optionLabel="nameVoucher"
                  class="w-full md:w-56" />
              </div>
            </div>
          </div>
        </div>

        <h6 class="mt-5"><b>2. Hình ảnh</b></h6>
        <div class="col-12 col-sm-12 col-md-5 col-lg-5 col-xl-5 ">
          <div class="d-flex justify-content-start">
            <p-fileupload mode="basic" name="demo[]" chooseIcon="pi pi-image" accept="image/*" maxFileSize="1000000"
              (onSelect)="onUploadPrimaryImg($event)" [auto]="true" chooseLabel="Chọn ảnh chính" />
          </div>
          <div class="mt-3 border">
            <p-image *ngIf="primaryImgDisplay" [src]="primaryImgDisplay" alt="Image" width="100%" [preview]="true" />
          </div>
        </div>

        <div class="col-12 col-sm-12 col-md-7 col-lg-7 col-xl-7 ">
          <div class="">
            <p-fileupload name="demo[]" [multiple]="true" accept="image/*" maxFileSize="1000000" mode="advanced"
              [auto]="true" chooseLabel="Chọn ảnh phụ" (onSelect)="onUploadChildrenImg($event)"
              (onRemove)="onRemoveChildrenImg($event)">
              <ng-template #empty>
                <div>Kéo và thả tệp vào đây để tải lên.</div>
              </ng-template>
              <ng-template #content>
              </ng-template>
            </p-fileupload>
          </div>
        </div>

        <h6 class="mt-5"><b>3. Mô tả</b></h6>
        <div class="col-12 col-sm-12 col-md-12 col-lg-12 col-xl-12 ">
          <div class="product-desc">
            <div id="editor" class="mb-5"></div>
            <div class="d-flex justify-content-end">
              <p-button label="Xác nhận" (click)="addProduct()" />
            </div>
          </div>
        </div>
      </div>
    </div>
  </c-card-body>
</c-card>

<!-- Category management form -->
<div class="card flex justify-center">

  <p-dialog header="Quản lý danh mục" [(visible)]="visibleCategoryForm" [modal]="true"
    [breakpoints]="{ '1199px': '75vw', '575px': '90vw' }" [style]="{ width: '50vw' }" [draggable]="false"
    [resizable]="false">

    <div class="d-flex justify-content-start my-3">
      <p-button label="+ Thêm" (click)="addCategory()" />
    </div>
    <p-table [value]="categories" showGridlines [autoLayout]="true">
      <ng-template pTemplate="header">
        <tr>
          <th class="text-center" style="width: 50px;">STT</th>
          <th class="text-center" style="width: 250px;">Tên loại</th>
          <th class="text-center" style="width: 50px;">Hành động</th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-category let-i="rowIndex">
        <tr>
          <td class="text-center">{{ i + 1 }}</td>
          <td class="text-center">
            <input pInputText [(ngModel)]="category.name" />
          </td>

          <td class="text-center">
            <p-button class="ms-2" icon="pi pi-trash" severity="danger" (click)="deleteCategory(category, $event)" />
          </td>
        </tr>
      </ng-template>
    </p-table>
    <div class="d-flex justify-content-end my-3">
      <p-button label="Cập nhật" (click)="addOrUpdateCategory()" />
    </div>
  </p-dialog>
</div>


<!-- Voucher management form -->
<div class="card flex justify-center">
  <p-dialog header="Quản lý voucher" [(visible)]="visibleVoucherForm" [modal]="true"
    [breakpoints]="{ '1199px': '75vw', '575px': '90vw' }" [style]="{ width: '80vw' }" [draggable]="false"
    [resizable]="false">

    <div class="d-flex justify-content-start my-3">
      <p-button label="+ Thêm" (click)="addVoucher()" />
    </div>
    <p-table [value]="vouchers" showGridlines >
      <ng-template pTemplate="header">
        <tr>
          <th class="text-center" style="width: 5%;">STT</th>
          <th class="text-center" style="width: 20%;">Tên voucher</th>
          <th class="text-center" style="width: 10%;">Phần trăm giảm</th>
          <th class="text-center" style="width: 15%;">Ngày bắt đầu</th>
          <th class="text-center" style="width: 15%;">Ngày kết thúc</th>
          <th class="text-center" style="width: 15%;">Ngày tạo</th>
          <th class="text-center" style="width: 10%;">Hành động</th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-voucher let-i="rowIndex">
        <tr [ngClass]="{'expired': isExpired(voucher.endDate)}">
          <td class="text-center">{{ i + 1 }}</td>
          <td class="text-center">
            <input pInputText [(ngModel)]="voucher.nameVoucher" />
          </td>
          <td class="text-center">
            <input pInputText [(ngModel)]="voucher.percent" style="width: 100px;" />
          </td>
          <td class="text-center">
            <p-datepicker  appendTo="body" dateFormat="dd/mm/yy" [(ngModel)]="voucher.startDate" [showIcon]="true"  [style]="{ width: '150px' }" inputId="startDate" />
          </td>
          <td class="text-center">
            <p-datepicker  appendTo="body" dateFormat="dd/mm/yy" [(ngModel)]="voucher.endDate" [showIcon]="true"  [style]="{ width: '150px' }" inputId="endDate" />
          </td>
          <td class="text-center">
            <span>{{ voucher.createDate | date:'dd/MM/yyyy' }}</span>
          </td>

          <td class="text-center">
            <p-button class="ms-2" icon="pi pi-trash" severity="danger" (click)="deleteVoucher(voucher, $event)" />
          </td>
        </tr>
      </ng-template>
    </p-table>
    <div class="d-flex justify-content-end my-3">
      <p-button label="Cập nhật" (click)="addOrUpdateVoucher()" />
    </div>
  </p-dialog>
</div>
