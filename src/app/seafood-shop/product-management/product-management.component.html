<router-outlet></router-outlet>
<c-card *ngIf="!isAddProductPage">
  <c-card-header>
    <h5>Quản lý sản phẩm</h5>
  </c-card-header>
  <c-card-body>

    <div class="d-flex justify-content-start">
      <p-button class="me-3" icon="pi pi-plus" label="Thêm sản phẩm" severity="success"
        (click)="navigateToAddProduct()" />

      <p-button class="me-3" icon="pi pi-print" label="Xuất Excel" severity="help" />
      <p-button class="me-3" icon="pi pi-trash" label="Xóa tất cả" severity="danger" />

    </div>
    <hr>

    <div class="d-flex justify-content-end">
      <div>
        <c-input-group class="mb-3">
          <input aria-describedby="button-addon2" aria-label="Nhập tên sản phẩm" cFormControl
            placeholder="Nhập tên sản phẩm" />
          <button cButton color="secondary" id="button-addon2" type="button" variant="outline">
            Tìm kiếm
          </button>
        </c-input-group>
      </div>
    </div>
    <p-table [value]="products" [tableStyle]="{'min-width': '60rem'}">

      <ng-template pTemplate="header">
        <tr>
          <th>Tên sản phẩm</th>
          <th>Hình ảnh</th>
          <th>Giá</th>
          <th>Loại</th>
          <th>Tình trạng</th>
          <th>Hành động</th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-product>
        <tr>
          <td>{{product.name}}</td>
          <td><img
              [src]="'https://image.tienphong.vn/w890/Uploaded/2025/rkznae/2020_12_28/55832_hai_san_nha_trang_JLSC.jpg'"
              [alt]="product.name" width="100" class="shadow-4" /></td>
          <td>{{product.price }}</td>
          <td>{{product.category}}</td>

          <td><p-tag [value]="product.inventoryStatus" [severity]="getSeverity(product.inventoryStatus)" /></td>
          <td>
            <p-button icon="pi pi-pen-to-square" severity="info" class="p-button-rounded p-button-sm" />
            <p-button icon="pi pi-trash" severity="danger" class="p-button-rounded p-button-sm" />
          </td>
        </tr>
        <tr>
          <td>{{product.name}}</td>
          <td><img
              [src]="'https://image.tienphong.vn/w890/Uploaded/2025/rkznae/2020_12_28/55832_hai_san_nha_trang_JLSC.jpg'"
              [alt]="product.name" width="100" class="shadow-4" /></td>
          <td>{{product.price }}</td>
          <td>{{product.category}}</td>

          <td><p-tag [value]="product.inventoryStatus" [severity]="getSeverity(product.inventoryStatus)" /></td>
          <td>
            <p-button icon="pi pi-pen-to-square" severity="info" class="p-button-rounded p-button-sm" />
            <p-button icon="pi pi-trash" severity="danger" class="p-button-rounded p-button-sm" />
          </td>
        </tr>
        <tr>
          <td>{{product.name}}</td>
          <td><img
              [src]="'https://image.tienphong.vn/w890/Uploaded/2025/rkznae/2020_12_28/55832_hai_san_nha_trang_JLSC.jpg'"
              [alt]="product.name" width="100" class="shadow-4" /></td>
          <td>{{product.price }}</td>
          <td>{{product.category}}</td>

          <td><p-tag [value]="product.inventoryStatus" [severity]="getSeverity(product.inventoryStatus)" /></td>
          <td>
            <p-button icon="pi pi-pen-to-square" severity="info" class="p-button-rounded p-button-sm" />
            <p-button icon="pi pi-trash" severity="danger" class="p-button-rounded p-button-sm" />
          </td>
        </tr>
      </ng-template>

    </p-table>
    <div class="card flex justify-center mt-2">
      <p-paginator (onPageChange)="onPageChange($event)" [first]="first" [rows]="rows" [totalRecords]="120"
        [rowsPerPageOptions]="[10, 20, 30]" />
    </div>
  </c-card-body>
</c-card>
